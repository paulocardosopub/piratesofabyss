name: Release desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows package
        run: npm run package:windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:GITHUB_REF_NAME
          $repo = $env:GITHUB_REPOSITORY
          $files = @("release/latest.yml")
          $files += Get-ChildItem release -File -Filter "Pirates-of-the-Abyss-Setup-*.exe" | Where-Object { $_.Name -notlike "*.__uninstaller.exe" } | ForEach-Object { $_.FullName }
          $files += Get-ChildItem release -File -Filter "Pirates-of-the-Abyss-Setup-*.exe.blockmap" | ForEach-Object { $_.FullName }
          $files += Get-ChildItem release -File -Filter "Pirates-of-the-Abyss-*-portable.exe" | ForEach-Object { $_.FullName }

          if ($files.Count -lt 4) {
            Write-Error "Arquivos de release incompletos: $($files -join ', ')"
          }

          function Invoke-Gh {
            param([string[]] $Arguments)
            & gh @Arguments
            if ($LASTEXITCODE -ne 0) {
              throw "gh $($Arguments -join ' ') falhou com codigo $LASTEXITCODE"
            }
          }

          gh release delete $tag --repo $repo --yes
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Nenhuma release anterior para remover."
          }

          Invoke-Gh @("release", "create", $tag, "--repo", $repo, "--title", $tag, "--notes", "Release $tag", "--latest", "--verify-tag")
          foreach ($file in $files) {
            Write-Host "Enviando $file"
            Invoke-Gh @("release", "upload", $tag, $file, "--repo", $repo)
          }
          Invoke-Gh @("release", "edit", $tag, "--repo", $repo, "--title", $tag, "--latest")
